/* ---------- 화면 맞춤 ---------- */
let RS=1,QUAL=1;
function fit(){
  const s=Math.min(innerWidth*0.98/W,(innerHeight-24)/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  RS=Math.max(.55,Math.min(2,Math.max(.8,s*(window.devicePixelRatio||1)))*QUAL);
  const w=Math.round(W*RS),h=Math.round(H*RS);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
}
addEventListener('resize',fit);fit();

const IMG={};
function loadImages(){return Promise.all(Object.entries(A.img).map(([k,src])=>new Promise(r=>{const i=new Image();i.onload=()=>{i.lw=i.naturalWidth/2;i.lh=i.naturalHeight/2;r();};i.onerror=r;i.src=src;IMG[k]=i;})));}
function img(name,x,y,w,h){const i=IMG[name];if(i&&i.complete&&i.lw)ctx.drawImage(i,x,y,w??i.lw,h??i.lh);}

let actx=null,master=null,muted=false;const SND={};
function b64buf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function initAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}

const FILLC={};
function fillOf(name){
  if(FILLC[name])return FILLC[name];const im=IMG[name];
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.drawImage(im,0,0);
  const d=g.getImageData(0,0,c.width,c.height).data,cnt={},sum={};
  for(let i=0;i<d.length;i+=4){if(d[i+3]<250)continue;const r=d[i],gg=d[i+1],b=d[i+2];if(Math.max(r,gg,b)-Math.min(r,gg,b)<70)continue;const k=(r>>4)+','+(gg>>4)+','+(b>>4);cnt[k]=(cnt[k]||0)+1;const s2=sum[k]||(sum[k]=[0,0,0]);s2[0]+=r;s2[1]+=gg;s2[2]+=b;}
  let best=null,bn=0;for(const k in cnt)if(cnt[k]>bn){bn=cnt[k];best=k;}
  return FILLC[name]=best?sum[best].map(v=>v/bn):[252,92,101];
}
function skinImg(base,skin){
  if(!skin)return base;const key=base+'@'+skin;if(IMG[key])return key;
  const im=IMG[base];if(!im||!im.naturalWidth)return base;
  const F=fillOf(base),N=hexRgb(SKINS[skin][1]);
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.drawImage(im,0,0);
  const id=g.getImageData(0,0,c.width,c.height),d=id.data,bases=[[255,255,255],[0,0,0]];
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0)continue;let bt=0,br=1e9,bb=null;
    for(const B of bases){const v0=F[0]-B[0],v1=F[1]-B[1],v2=F[2]-B[2],dd=v0*v0+v1*v1+v2*v2;let t=((d[i]-B[0])*v0+(d[i+1]-B[1])*v1+(d[i+2]-B[2])*v2)/dd;t=Math.max(0,Math.min(1.05,t));const res=Math.hypot(d[i]-B[0]-t*v0,d[i+1]-B[1]-t*v1,d[i+2]-B[2]-t*v2);if(res<br){br=res;bt=t;bb=B;}}
    if(br<30&&bt>.08){const t=bt>.92?1:bt;for(let k=0;k<3;k++)d[i+k]=Math.round(bb[k]+t*(N[k]-bb[k]));}
  }
  g.putImageData(id,0,0);c.lw=im.lw;c.lh=im.lh;c.complete=true;c.naturalWidth=c.width;c.naturalHeight=c.height;IMG[key]=c;return key;
}

function pickType(){
  const needHeart=players.some(p=>!p.dead&&p.hp<MAXHP);
  const list=[...Object.entries(WEAPON_W),...Object.entries(ITEMS).filter(([k])=>k!=='heart'||needHeart).map(([k,v])=>[k,v.w])];
  let tot=list.reduce((a,[,w])=>a+w,0),r=Math.random()*tot;
  for(const [k,w] of list){r-=w;if(r<=0)return k;}return list[0][0];
}
function addItem(type,x,y,vx=0,vy=0){items.push({type,x,y,vx,vy,ground:false,t:0,life:16});}
function spawnItem(){
  const free=level.items.filter(([c,r])=>!items.some(it=>Math.hypot(it.x-(c*T+T/2),it.y-(r*T+T/2))<80));
  if(!free.length)return;const [c,r]=free[Math.random()*free.length|0];
  const x=c*T+T/2,y=r*T+T/2;let t=pickType();if(t==='bag'&&items.length>2)t='gem';
  addItem(t,x,y);fx('spawn',x,y);sfx('spawn',.5);
}
function applyItem(p,it){

  else if(t==='shield'){if(p.shield)return false;p.shield=true;}
  else if(t==='helmet'){if(p.helmet)return false;p.helmet=true;}
  else if(t==='heart'){if(p.hp>=MAXHP)return false;p.hp++;sfx('heal',.6);}

  else if(t==='hat'){p.jumpT=8;p.speedT=0;}
  else if(t==='gem'){if(p.spCd<=0)return false;p.spCd=0;sfx('powerup',.5,1.3);}
  else if(t==='bag'){for(let k=0;k<3;k++){let n=pickType();while(n==='bag')n=pickType();addItem(n,it.x,it.y-20,(k-1)*260,-560-k%2*120);}sfx('powerup',.4,1.5);}

}
function updateItems(dt){

function updateShots(dt){
  for(const s of shots){
    if(s.owner&&s.owner.freezeT>0)continue;
    s.life-=dt;s.spin=(s.spin||0)+dt*(s.type==='saw'?16:s.type==='star'?18:s.type==='thrown'?14:s.type==='pot'?6:s.type==='rock'||s.type==='crate'?8:s.type==='boulder'?s.vx/26:0);
    if(s.type==='hook'){const o=s.owner;if(o.dead||o.stun>0)s.life=0;}
    if(s.type==='mine'){
      s.fuse-=dt;s.armT+=dt;
      if(s.g){s.vy=Math.min(s.vy+s.g*dt,900);const ny=s.y+s.vy*dt,c=Math.floor(s.x/T),r=Math.floor((ny+12)/T);if(s.vy>0&&(solid(c,r)||oneway(c,r))){s.y=r*T-12;s.vy=0;}else s.y=ny;}
      const near=foesOf(s.owner).some(mf=>Math.hypot(mf.cx-s.x,mf.cy-s.y)<48);
      if(s.fuse<=0||(s.prox&&s.armT>.5&&near)){explode(s.x,s.y,s.owner,s.decoy?118:108,2);s.life=0;s.boom=true;}
      if(s.y>H+40)s.life=0;
      continue;
    }
    if(s.type==='saw'||s.type==='boulder'){
      s.vy+=s.g*dt;
      const nx=s.x+s.vx*dt;if(solidAt(nx+Math.sign(s.vx)*s.r,s.y)){if(s.type==='boulder'){if(s.bounced){s.life=0;fx('puff',s.x,s.y);sfx('break',.6,.7);}else{s.bounced=1;s.vx=-s.vx*.8;sfx('thud',.6);}}else{s.vx=-s.vx;sfx('tink',.3);}}else s.x=nx;
      const ny=s.y+s.vy*dt;if(s.vy>0&&(solidAt(s.x,ny+s.r)||(oneway(Math.floor(s.x/T),Math.floor((ny+s.r)/T))&&s.y+s.r<=Math.floor((ny+s.r)/T)*T+2))){s.y=Math.floor((ny+s.r)/T)*T-s.r;s.vy=0;}else s.y=ny;
      if(s.x<-40||s.x>W+40)s.life=0;
    }else{s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;}
    // 반사막
    for(const p of allEnts())if(!p.dead&&isFoe(p,s.owner)&&p.barrierT>0&&s.type!=='hook'&&Math.hypot(s.x-p.cx,s.y-(p.cy))<60)reflect(s,p);
    let foe=null;for(const f of foesOf(s.owner))if(!(f.invisT>0)&&overlap(s.x-s.r,s.y-s.r,s.r*2,s.r*2,f.x,f.y,f.w,f.h)){foe=f;break;}
    if(s.life>0&&s.type!=='hook'&&ballOver(s.x-s.r,s.y-s.r,s.r*2,s.r*2)){
      if(s.type==='blast')explode(s.x,s.y,s.owner);else if(s.type==='pot'){s.boom=true;explode(s.x,s.y,s.owner,135,s.dmg||2);}
      else kickBall(ball.vx*.3+Math.sign(s.vx||1)*720,-400);
      s.life=0;continue;
    }
    if(foe&&s.life>0){
      if(s.type==='blast')explode(s.x,s.y,s.owner);
      else if(s.type==='pot'){s.boom=true;explode(s.x,s.y,s.owner,135,s.dmg||2);}
      else if(s.type==='hook'){const o=s.owner,d=Math.sign(o.cx-foe.cx||1);if(s.ult){foe.inv=0;hit(foe,0,d*1150,-300,s.x,true);foe.stun=.6;sfx('grab',.9);later(.3,()=>{if(!foe.dead){foe.inv=0;hit(foe,3,o.face*450,-1150,o.cx,true);shake(.3,14);}});}else if(hit(foe,1,d*820,-380,s.x)){foe.stun=.42;sfx('grab',.7);}}
      else{const d=SHOT[s.type],dmg=s.dmg||d.dmg;const ok=hit(foe,dmg,Math.sign(s.vx||1)*d.kx,d.ky,s.x-s.vx*.05);if(ok&&s.type==='ink'){foe.slowT=Math.max(foe.slowT,2);foe.inkT=2;popText('느려짐',foe.cx,foe.y-30,INK,24);for(let k=0;k<12;k++){const a=Math.random()*6.28,sp=150+Math.random()*250;parts.push({k:'dot',c:INK,x:s.x,y:s.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,g:1200,r:3+Math.random()*4,life:.5,max:.5});}sfx('splash',.6,1.2);}
      if(ok&&(s.type==='orb'||s.type==='charm')){foe.stun=s.type==='charm'?.75:1.15;for(let k=0;k<8;k++)parts.push({k:'dot',c:'#ffe066',x:foe.cx+(Math.random()-.5)*40,y:foe.cy+(Math.random()-.5)*50,vx:0,vy:0,g:0,r:4,life:.6,max:.6});}}
      s.life=0;continue;
    }
    if(s.type!=='saw'&&s.type!=='boulder'&&s.life>0){
      const c=Math.floor(s.x/T),r=Math.floor(s.y/T);
      if(solid(c,r)&&c>=0&&c<COLS){
        if(s.type==='ball'&&s.bounces>0){
          s.bounces--;s.x-=s.vx*dt;s.y-=s.vy*dt;
          if(solidAt(s.x,s.y+s.vy*dt*1.5))s.vy=-s.vy*.55;else s.vx=-s.vx*.55;sfx('thud',.5);
        }else{
          if(s.type==='blast')explode(s.x,s.y,s.owner);
          else if(s.type==='pot'){s.boom=true;explode(s.x,s.y,s.owner,135,s.dmg||2);}
          else if(s.type==='hook'){const o=s.owner;o.vx=Math.sign(s.x-o.cx||o.face)*950;o.vy=-560;o.jumping=false;o.ground=false;sfx('grab',.6,.8);fx('puff',s.x,s.y);}
          else{fx('puff',s.x,s.y);sfx('tink',.35);}
          s.life=0;
        }
      }
    }
    if(s.x<-60||s.x>W+60||s.y>H+60){if(s.type==='blast'&&s.x>-60&&s.x<W+60)explode(s.x,s.y,s.owner);s.boom=true;s.life=0;}
    if(s.type==='pot'&&s.life<=0&&!s.boom){s.boom=true;explode(s.x,s.y,s.owner,135,s.dmg||2);}
  }
  for(const s of shots)if(s.life<=0&&s.type==='hook')s.owner.hookOut=false;
  shots=shots.filter(s=>s.life>0);
}

  else{p.vy=-720;p.vx=(Math.sign(p.vx)||-p.face)*Math.max(280,Math.abs(p.vx));p.spin=(Math.sign(p.vx)||1)*11;}
  fx('ko',Math.min(W-20,Math.max(20,p.cx)),Math.min(H-20,p.cy),p.color);sfx('ko',.85);shake(.4,14);

}

function tick(dt){
  time+=dt;if(toastT>0)toastT-=dt;if(bannerT>0)bannerT-=dt;if(timeStopT>0)timeStopT-=dt;if(flashT>0)flashT-=dt;if(ultFx){ultFx.t-=dt;if(ultFx.t<=0)ultFx=null;}
  if(paused){clearLatch();return;}
  const inp=[readInput(0),readInput(1)];
  if(state==='title'){
    if(inp[0].upP||inp[1].upP){menuSel=(menuSel+2)%3;sfx('tick',.4);}if(inp[0].downP||inp[1].downP){menuSel=(menuSel+1)%3;sfx('tick',.4);}
    let go=inp[0].atkP||inp[1].atkP||latch['Space'];
    if(clickReq){const k=menuAt(clickX,clickY);if(k>=0){menuSel=k;go=true;}}
    if(go){if(menuSel===0){state='mode';sfx('open',.6);}else if(menuSel===1){state='controls';sfx('open',.6);}else{state='keys';ki=0;waitSlot=null;sfx('open',.6);}}
    else world(dt,[NOINPUT,NOINPUT]);
    clearLatch();return;
  }
  if(state==='keys'){world(dt,[NOINPUT,NOINPUT]);clearLatch();return;}
  if(state==='mode'){
    for(const i of[0,1]){if(inp[i].leftP){modeSel=(modeSel+4)%5;sfx('tick',.4);}if(inp[i].rightP){modeSel=(modeSel+1)%5;sfx('tick',.4);}if(inp[i].upP){setCpuOpt(cpuOpt-1);sfx('tick',.4);}if(inp[i].downP){setCpuOpt(cpuOpt+1);sfx('tick',.4);}}
    let go=inp[0].atkP||inp[1].atkP||latch['Space'];
    if(clickReq){const k=modeAt(clickX,clickY);if(k===99){setCpuOpt(cpuOpt+1);sfx('tick',.4);}else if(k>=0){modeSel=k;go=true;}}
    if(go){mode=MODES[modeSel].id;toSelect();}
    else if(inp[0].spP||inp[1].spP){state='title';sfx('close',.5);}
    else world(dt,[NOINPUT,NOINPUT]);
    clearLatch();return;
  }
  if(state==='controls'){
    if(inp[0].atkP||inp[1].atkP||inp[0].spP||inp[1].spP||clickReq||latch['Space']){state='title';sfx('close',.5);}
    else world(dt,[NOINPUT,NOINPUT]);
    clearLatch();return;
  }
  if(state==='select'){
    for(let i=0;i<2;i++){
      const s=pick[i],o=pick[1-i];
      if(i===1&&cpu.on)continue;
      if(!s.lock){
        const NS=CHARS.length+1;if(inp[i].leftP){s.cur=(s.cur+NS-1)%NS;sfx('tick',.4);}
        if(inp[i].rightP){s.cur=(s.cur+1)%NS;sfx('tick',.4);}
        if(inp[i].upP||inp[i].downP){s.cur=s.cur<13?Math.min(s.cur+13,NS-1):s.cur-13;sfx('tick',.4);}
        if(inp[i].sp2P){s.skin=(s.skin+1)%SKINS.length;sfx('tick',.4);}
        if(inp[i].ultP){s.skin=(s.skin+SKINS.length-1)%SKINS.length;sfx('tick',.4);}
        if(inp[i].spP){state='mode';sfx('close',.5);}
        if(inp[i].atkP&&s.cur===CHARS.length){const c=Math.random()*CHARS.length|0;s.cur=c;s.lock=true;sfx('ready',.7);toast('랜덤: '+CHARS[c].name);}
        else if(inp[i].atkP){s.lock=true;sfx('ready',.7);}
      }else if(inp[i].spP){s.lock=false;sfx('close',.5);}
    }
    if(pick[0].lock&&pick[1].lock){selReadyT+=dt;if(selReadyT>.7)startMatch();}else selReadyT=0;
    clearLatch();return;
  }
  if(state==='count'){
    countT-=dt;const n=Math.ceil(countT);
    if(n!==lastN&&n>0){lastN=n;sfx('tick',.6);}
    if(countT<=0){state='play';goT=.8;sfx('go',.8);}
    world(dt,[NOINPUT,NOINPUT]);clearLatch();return;
  }
  if(state==='play'){
    if(goT>0)goT-=dt;
    spawnT-=dt;if(spawnT<=0){if(items.length<(mode==='soccer'?2:4))spawnItem();spawnT=2.4+Math.random()*2.6;}
    world(dt,inp);
    if(mode==='battle'){
      const down=players.filter(p=>!p.dead&&(p.hp<=0||p.y>H+40));
      if(down.length){down.forEach(ko);winner=down.length===2?-1:1-down[0].i;if(winner>=0)wins[winner]++;state='roundEnd';endT=2.8;}
    }else{
      for(const p of players)if(!p.dead&&(p.hp<=0||p.y>H+40))koRespawn(p);
      if(state==='play')modeTick(dt);
    }
    clearLatch();return;
  }
  if(state==='roundEnd'){
    endT-=dt;world(dt,players.map((p,i)=>p.dead?NOINPUT:inp[i]));
    if(endT<=0){if(wins[0]>=WIN_ROUNDS||wins[1]>=WIN_ROUNDS){state='matchEnd';endT=0;sfx('win',.8);}else{if(winner<0)round--;startRound();}}
    clearLatch();return;
  }
  if(state==='matchEnd'){
    endT+=dt;
    if(endT>.8){
      if(inp[0].atkP||inp[1].atkP||clickReq)startMatch();
      else if(inp[0].spP||inp[1].spP)toSelect();
    }
    clearLatch();return;
  }
}

function world(rdt,inp){
  if(slowT>0){slowT-=rdt;if(slowT<=0)timeScale=1;}
  for(const c of clouds){c.x+=c.v*rdt;if(c.x>W+140)c.x=-160;}
  if(hitstop>0){hitstop-=rdt;skipFrame=true;return;}
  const dt=rdt*timeScale;
  if(saw){saw.a+=dt*12;const ph=(Math.sin(time*2*Math.PI/saw.period)+1)/2;saw.x=saw.x0+(saw.x1-saw.x0)*ph;}
  updateGimmicks(dt);
  const cpuAct=state==='play'||state==='roundEnd';
  for(let i=0;i<2;i++)entStep(players[i],dt,(i===1&&cpu.on&&cpuAct&&!players[1].dead)?cpuInput(players[1],dt):inp[i]);
  for(const e of enemies)entStep(e,dt,(state==='play'&&!e.dead)?cpuInput(e,dt):NOINPUT);
  if(state==='play')for(const e of enemies)if(e.boss&&!e.dead)bossThink(e,dt);
  const ents=allEnts().filter(e=>!e.dead);
  for(let ii=0;ii<ents.length;ii++)for(let jj=ii+1;jj<ents.length;jj++){
    const a=ents[ii],b=ents[jj];if(a.dead||b.dead||!isFoe(a,b))continue;
    let stomped=false;
    for(const [u,v] of [[a,b],[b,a]]){
      const ox=Math.min(u.x+u.w,v.x+v.w)-Math.max(u.x,v.x);
      if(!(u.rollBig&&u.rollT>0)&&!(v.rollBig&&v.rollT>0)&&u.vy>150&&u.y+u.h>v.y&&u.y+u.h-v.y<(u.slam===2?40:24)&&ox>10){
        const slam=u.slam===2||u.ch.id==='bounce';u.vy=-740;u.jumping=false;u.slam=0;stomped=true;sfx('stomp',.7);v.sq=.6;
        hit(v,slam?2:1,Math.sign(v.cx-u.cx||1)*(slam?420:240),slam?-500:120,u.cx,true);
      }
    }
    if(!stomped&&a.dashT<=0&&b.dashT<=0&&overlap(a.x,a.y,a.w,a.h,b.x,b.y,b.w,b.h)){
      const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x),s=a.cx<b.cx?-1:1;
      a.moveX(s*ox/2);b.moveX(-s*ox/2);
    }
  }
  for(const p of allEnts()){
    if(p.dead)continue;
    const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w-1)/T),r0=Math.floor(p.y/T),r1=Math.floor((p.y+p.h-1)/T);
    let spiked=false;
    for(let r=r0;r<=r1&&!spiked;r++)for(let c=c0;c<=c1;c++)if(cell(c,r)==='^'&&overlap(p.x,p.y,p.w,p.h,c*T+6,r*T+34,52,30)){spiked=true;break;}
    if(spiked){p.vy=-1080;p.jumping=false;p.ground=false;p.slam=0;sfx('spike',.6);hit(p,2,p.vx*.4,-1080,p.cx,true);p.vy=Math.min(p.vy,-1000);}
    if(saw&&Math.hypot(p.cx-saw.x,p.cy-saw.y)<46){sfx('saw',.6);hit(p,2,Math.sign(p.cx-saw.x||1)*650,-680,saw.x,true);}
  }
  for(const tm of timers){if(tm.done)continue;tm.t-=dt;if(tm.t<=0){tm.done=true;tm.fn();}}
  timers=timers.filter(t=>!t.done);
  for(const z of zones){
    if(z.type==='scrawl'){
      const g=z.target;z.t-=dt;if(!g.dead){z.x=g.cx;z.y=g.cy;}
      if(Math.random()<.5)sfx('draw',.25,1.4+Math.random());
      if(z.t<=0&&!z.done){z.done=true;
        if(!g.dead){if(g.weapon){g.weapon=null;g.uses=0;}g.shield=false;g.helmet=false;g.barrierT=0;g.speedT=0;g.jumpT=0;g.rageT=0;g.invisT=0;g.sprintT=0;g.armorT=0;
          g.inv=0;hit(g,2,0,-420,z.x,true);g.slowT=Math.max(g.slowT,2.5);g.inkT=2.5;popText('먹칠!',g.cx,g.y-36,INK,34);}
        for(let k=0;k<18;k++){const a=Math.random()*6.28,sp=200+Math.random()*350;parts.push({k:'dot',c:INK,x:z.x,y:z.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-150,g:1300,r:4+Math.random()*6,life:.6,max:.6});}
        shake(.25,9);sfx('splash',.8,.6);}
      continue;
    }
    if(z.type==='hole'){
      z.t-=dt;z.tick-=dt;let ticked=false;
      for(const foe of foesOf(z.owner)){const dx=z.x-foe.cx,dy=z.y-foe.cy,d=Math.hypot(dx,dy)||1;if(d<300){const k=1-d/300;foe.moveX(dx/d*(210+130*k)*dt);if(k>.35){foe.vy=approach(foe.vy,dy/d*360,(2000*k)*dt);}if(k>.45){foe.ground=false;foe.jumping=false;}if(d<70&&z.tick<=0&&(z.hits||0)<2){ticked=true;z.hits=(z.hits||0)+1;foe.inv=0;hit(foe,1,null,null,z.x,true);}}}
      if(ticked||z.tick<=0)z.tick=.7;
      for(const q of shots)if(isFoe(z.owner,q.owner)&&q.type!=='mine'&&Math.hypot(q.x-z.x,q.y-z.y)<110){q.life=0;q.boom=true;}
      for(const it of items){const dx=z.x-it.x,dy=z.y-it.y,d=Math.hypot(dx,dy)||1;if(d<300){it.x+=dx/d*160*dt;it.y+=dy/d*160*dt;it.ground=false;it.vy=0;}}
      for(const c of coins){const dx=z.x-c.x,dy=z.y-c.y,d=Math.hypot(dx,dy)||1;if(d<300){c.x+=dx/d*200*dt;c.y+=dy/d*200*dt;c.ground=false;c.vy=0;}}
      if(ball&&goalT<=0){const dx=z.x-ball.x,dy=z.y-ball.y,d=Math.hypot(dx,dy)||1;if(d<340){ball.vx+=dx/d*900*dt;ball.vy+=dy/d*900*dt-1700*dt*.6;}}
      if(Math.random()<.6){const a=Math.random()*6.28,r=120+Math.random()*80;parts.push({k:'dot',c:INK,x:z.x+Math.cos(a)*r,y:z.y+Math.sin(a)*r,vx:-Math.cos(a)*r*2.2,vy:-Math.sin(a)*r*2.2,g:0,r:3,life:.4,max:.4});}
      if(z.t<=0&&!z.done){z.done=true;explode(z.x,z.y,z.owner,175,2);}
      continue;
    }
    z.t-=dt;z.x+=z.vx*dt;if(z.x<40||z.x>W-40){if(z.type==='wave')z.t=0;else z.vx=-z.vx;}z.tick-=dt;let ticked=false;
    for(const foe of foesOf(z.owner))if(Math.abs(foe.cx-z.x)<(z.w||58)&&foe.y+foe.h>z.gy-240&&foe.y<z.gy+10){if(z.type==='wave'){foe.vx=z.vx*2.5;foe.vy=Math.min(foe.vy,-300);foe.stun=Math.max(foe.stun,.2);if(!z.hit.has(foe)){z.hit.add(foe);foe.inv=0;hit(foe,2,z.vx*2.5,-480,z.x,true);}continue;}foe.vy=Math.min(foe.vy,-520);foe.vx=approach(foe.vx,z.vx,1500*dt);foe.ground=false;foe.jumping=false;if(z.tick<=0){ticked=true;foe.inv=0;hit(foe,1,Math.sign(z.vx)*160,-650,z.x,true);}}
    if(ticked)z.tick=.5;
    for(const it of items)if(Math.abs(it.x-z.x)<50&&it.y>z.gy-240){it.vy=-400;it.ground=false;}
  }
  zones=zones.filter(z=>z.t>0);
  for(const p of players){
    if(p.dead)continue;
    if(state==='play')p.ult=Math.min(100,p.ult+dt*2.2*(p.ch.ultRate||1));
    for(const foe of foesOf(p)){
      if(p.orbitT>0)for(let k=0;k<4;k++){const a=time*5+k*Math.PI/2,sx=p.cx+Math.cos(a)*80,sy=p.cy+Math.sin(a)*80;if(Math.hypot(foe.cx-sx,foe.cy-sy)<40)hit(foe,1,Math.sign(foe.cx-p.cx||1)*520,-380,sx,true);}
      if(p.bigT>0&&Math.hypot(foe.cx-p.cx,foe.cy-p.cy)<66)hit(foe,1,Math.sign(foe.cx-p.cx||1)*740,-380,p.cx,true);
    }
  }
  for(const cl of clones){cl.t-=dt;cl.punchT=Math.max(0,cl.punchT-dt);if(cl.owner.dead)cl.t=0;
    for(const q of shots)if(q.life>0&&isFoe(cl.owner,q.owner)&&q.type!=='mine'&&overlap(q.x-q.r,q.y-q.r,q.r*2,q.r*2,cl.x-20,cl.y-56,40,56)){q.life=0;q.boom=true;cl.t=0;fx('puff',cl.x,cl.y-28);sfx('magic',.4);}
    if(cl.t<=0)fx('puff',cl.x,cl.y-28);}
  clones=clones.filter(cl=>cl.t>0);
  for(const b of tempBlocks){b.t-=dt;b.age+=dt;if(b.t<=0){if(level.grid[b.r][b.c]===(b.ch||'X'))level.grid[b.r][b.c]='.';fx('puff',b.c*T+32,b.r*T+32);sfx('break',.4,1.2);}}
  tempBlocks=tempBlocks.filter(b=>b.t>0);
  for(const b of bolts){
    if(b.flash>0){b.flash-=dt;continue;}
    b.t-=dt;
    if(b.t<=0&&!b.done){
      b.done=true;b.flash=.2;let gy=H;for(let r=0;r<ROWS;r++)if(solid(Math.floor(b.x/T),r)){gy=r*T;break;}b.gy=gy;
      shake(.25,10);sfx('zap',.7,1.6);fx('puff',b.x,gy-10);parts.push({k:'img',n:'effect_blastLarge',x:b.x,y:gy-16,s0:.5,s1:2,life:.25,max:.25,rot:0});
      for(const foe of foesOf(b.owner))if(Math.abs(foe.cx-b.x)<46)hit(foe,b.dmg||2,Math.sign(foe.cx-b.x||1)*300,-760,b.x,true);
    }
  }
  bolts=bolts.filter(b=>!b.done||b.flash>0);
  updateShots(dt);
  updateItems(dt);
  modeWorld(dt);
  for(const q of parts){q.life-=dt;if(q.k==='dot'){q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}if(q.k==='text')q.y+=q.vy*dt;}
  parts=parts.filter(q=>q.life>0);
  if(shakeT>0){shakeT-=rdt;if(shakeT<=0)shakeM=0;}
}

function text(s,x,y,size,color,align='center',outline=true,weight=700,maxW=0){
  ctx.font=`${weight} ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
  if(maxW>0){const tw=ctx.measureText(s).width;if(tw>maxW){size=Math.max(9,size*maxW/tw);ctx.font=`${weight} ${size}px ${FONT}`;}}
  if(outline){ctx.lineJoin='round';ctx.lineWidth=Math.max(5,size*.18);ctx.strokeStyle=PAPER;ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function wrapText(s,x,y,maxW,size,color,lh){
  ctx.font=`400 ${size}px ${FONT}`;const words=s.split(' ');let line='',yy=y;
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){text(line,x,yy,size,color,'left',false,400);line=w;yy+=lh;}else line=t;}
  if(line)text(line,x,yy,size,color,'left',false,400);
}
function boilText(s,x,y,size,color){
  ctx.font=`700 ${size}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='left';
  const chars=[...s],ws=chars.map(c=>ctx.measureText(c).width),tw=ws.reduce((a,b)=>a+b,0);
  const R=rng(1+(REDUCED?0:Math.floor(time/.14))*7);let cx=x-tw/2;
  chars.forEach((ch,i)=>{
    const jx=(R()-.5)*3,jy=(R()-.5)*3,jr=(R()-.5)*.05;
    ctx.save();ctx.translate(cx+ws[i]/2+jx,y+jy);ctx.rotate(jr);ctx.textAlign='center';
    ctx.lineJoin='round';ctx.lineWidth=size*.2;ctx.strokeStyle=PAPER;ctx.strokeText(ch,0,0);
    ctx.lineWidth=size*.055;ctx.strokeStyle=INK;ctx.strokeText(ch,0,0);
    ctx.fillStyle=color;ctx.fillText(ch,0,0);ctx.restore();cx+=ws[i];
  });
}
function keycap(label,x,y,w=52,size=30){img('ui_box',x,y,w,52);text(label,x+w/2,y+25,size,INK,'center',false);}
function sketchRect(x,y,w,h,fill,lw=3,seed=1){
  const R=rng(seed+(REDUCED?0:Math.floor(time/.2))*13),j=()=>(R()-.5)*2.4;
  ctx.beginPath();ctx.moveTo(x+j(),y+j());ctx.lineTo(x+w+j(),y+j());ctx.lineTo(x+w+j(),y+h+j());ctx.lineTo(x+j(),y+h+j());ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.lineWidth=lw;ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.stroke();
}

        ctx.beginPath();ctx.moveTo(x0,y0+2+R()*2);for(let k=1;k<=8;k++){if(k/8>pr)break;ctx.lineTo(x0+k*8,y0+2+R()*3);}ctx.stroke();

        ctx.lineWidth=2.5;ctx.strokeStyle='#e0861c';for(let k=0;k<6;k++){if((k+1)/6>pr)break;const hx=x0+4+k*10;ctx.beginPath();ctx.moveTo(hx,y0+13);ctx.lineTo(hx+8,y0+4);ctx.stroke();}ctx.restore();}
      else img('tile_crate',b.c*T+32-32*sc,b.r*T+32-32*sc,64*sc,64*sc);ctx.globalAlpha=1;}

/* ---------- 루프 ---------- */
let last=performance.now(),acc=0;
let pfT=0,pfN=0,pfSlow=0;
function frame(now){
  const raw=(now-last)/1000,d=Math.min(.1,raw);last=now;
  pollPads();
  acc+=d;let n=0;while(acc>=STEP&&n<5){tick(STEP);acc-=STEP;n++;}if(n>=5)acc=0;
  render();
  if(raw<.5&&!document.hidden){pfT+=raw;pfN++;if(pfT>2){const avg=pfT/pfN;
    if(avg>1/50&&QUAL>.5){QUAL=Math.max(.5,QUAL*.85);fit();pfSlow=0;}
    else if(avg<1/58&&QUAL<1){if(++pfSlow>=2){QUAL=Math.min(1,QUAL*1.12);fit();pfSlow=0;}}
    pfT=0;pfN=0;}}
  requestAnimationFrame(frame);
}
function prewarmSkins(){
  const jobs=[];
  for(const d of Object.values(EDEF))jobs.push([d.base,d.skin],['character_hand'+d.hand,d.skin]);
  for(const B of Object.values(BOSSES))for(const d of B.list)jobs.push([d.base,d.skin],['character_hand'+d.hand,d.skin]);
  for(const c of CHARS)if(c.baseSkin)jobs.push([c.body,c.baseSkin],['character_hand'+c.hand,c.baseSkin]);
  for(const c of CHARS)if(c.id==='rock')jobs.push(['__tint',skinImg(c.body,c.baseSkin||0)],['__tint',skinImg('character_hand'+c.hand,c.baseSkin||0)]);
  const step=()=>{const j=jobs.shift();if(!j)return;try{if(j[0]==='__tint')tintImg(j[1],'stone');else{skinImg(j[0],j[1]);bodyInfo(skinImg(j[0],j[1]));}}catch(e){}setTimeout(step,30);};
  setTimeout(step,500);
}

})();
